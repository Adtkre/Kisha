name: Ping Backend (Keep Alive)

on:
  schedule:
    # Runs every 14 minutes (Render free tier spins down after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging https://kisha-backend.onrender.com/ at $(date -u)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --max-time 90 https://kisha-backend.onrender.com/health || curl -s -o /dev/null -w "%{http_code}" --retry 2 --max-time 90 https://kisha-backend.onrender.com/)
          echo "Received HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Backend ping successful! Render instance is kept awake."
          else
            echo "Warning: Received unexpected status code $STATUS"
          fi

