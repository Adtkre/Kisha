<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div id="app">
    <div class="screen active" id="screen-calendar">

      <h2 class="section-title" style="margin-top:6px;">Calendar</h2>
      <div class="glass" style="padding:18px 10px 10px;">
        <div class="cal-head" style="padding:0 10px;">
          <div class="cal-nav-btn" onclick="prevMonth()">‹</div>
          <div style="font-weight:700; font-size:15px;" id="calMonthLabel">Loading...</div>
          <div class="cal-nav-btn" onclick="nextMonth()">›</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="legend" style="margin-top:14px;">
        <div class="legend-item">
          <div class="legend-swatch" style="background:var(--berry-bush);"></div>Period Days
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:var(--berry-bush); width:5px; height:5px;"></div>Log Completed
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="border:2px solid var(--berry-bush); background:none;"></div>Today
        </div>
      </div>
    </div>
  </div>

  <div id="bottomNav" class="show">
    <div class="nav-item" data-target="dashboard" onclick="window.location.href='dashboard.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5" />
        <path d="M5 9v11h14V9" />
      </svg>
      Home
    </div>
    <div class="nav-item" data-target="calendar" onclick="window.location.href='calendar.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="3" />
        <path d="M8 3v4M16 3v4M3 10h18" />
      </svg>
      Calendar
    </div>
    <div class="nav-item" data-target="dailylog" onclick="window.location.href='dailylog.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V9z" />
        <path d="M14 3v6h6M9 13h6M9 17h6" />
      </svg>
      Log
    </div>
    <div class="nav-item" data-target="analytics" onclick="window.location.href='analytics.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18M6 21V10M12 21V4M18 21v-7" />
      </svg>
      Insights
    </div>
    <div class="nav-item" data-target="profile" onclick="window.location.href='profile.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
      </svg>
      Profile
    </div>
  </div>


  <div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet()">
    <div class="glass sheet" id="sheetContent"></div>
  </div>
  <div id="toast"
    style="position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:var(--weathervane); color:#F0D2DE; padding:12px 22px; border-radius:16px; font-size:13.5px; font-weight:600; z-index:200; transition:transform .35s ease; box-shadow:0 8px 24px rgba(0,0,0,0.25);">
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    highlightNav('calendar');
    requireAuth();
    buildCalendar();
  </script>
</body>

</html>
