<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Create Account — Kisha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<a class="back-btn" href="index.html" aria-label="Back to start">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</a>

<div id="app">
  <div class="screen active" id="screen-signup">

    <div class="auth-wrap">
      <div class="glass auth-card">
        <div class="logo" style="text-align:center; margin-bottom:20px;">Kisha ✿</div>
        <div class="auth-title">Create your account</div>
        <div class="auth-sub">Begin your wellness journey today</div>
        <div class="field"><label>Full Name</label><input type="text" placeholder="Aditi Sharma"></div>
        <div class="field"><label>Email</label><input type="email" placeholder="you@example.com"></div>
        <div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>
        <div class="field"><label>Confirm Password</label><input type="password" placeholder="••••••••"></div>
        <label class="checkbox-row"><input type="checkbox"> I agree to the Terms & Privacy Policy</label>
        <button class="clay-btn btn-primary btn-block" onclick="window.location.href='onboarding.html'">Create Account</button>
        <div class="auth-switch">Already have an account? <a onclick="window.location.href='login.html'">Login</a></div>
      </div>
    </div>
  </div>
</div>


<script src="js/main.js"></script>

</body>
</html>
