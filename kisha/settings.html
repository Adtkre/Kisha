<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Settings — Kisha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div id="app">
  <div class="screen active" id="screen-settings">

    <h2 class="section-title" style="margin-top:6px; color:var(--weathervane);">Settings</h2>
    <div class="glass-dark settings-list">
      <div class="settings-row">Appearance <span style="color:rgba(240,210,222,0.6); font-size:12.5px;">Light ›</span></div>
      <div class="settings-row">Notifications <div class="toggle on" onclick="this.classList.toggle('on')"><div class="toggle-dot"></div></div></div>
      <div class="settings-row">Privacy <span style="color:rgba(240,210,222,0.6); font-size:12.5px;">›</span></div>
      <div class="settings-row">Export Data <span style="color:rgba(240,210,222,0.6); font-size:12.5px;">›</span></div>
      <div class="settings-row danger">Delete Account <span style="font-size:12.5px;">›</span></div>
      <div class="settings-row danger" onclick="window.location.href='index.html'" style="cursor:pointer;">Logout <span style="font-size:12.5px;">↪</span></div>
    </div>
  </div>
</div>


<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet()">
  <div class="glass sheet" id="sheetContent"></div>
</div>
<div id="toast" style="position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:var(--weathervane); color:#F0D2DE; padding:12px 22px; border-radius:16px; font-size:13.5px; font-weight:600; z-index:200; transition:transform .35s ease; box-shadow:0 8px 24px rgba(0,0,0,0.25);"></div>

<script src="js/main.js"></script>

</body>
</html>
