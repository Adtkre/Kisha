<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dashboard — Kisha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div id="app">
  <div class="screen active" id="screen-dashboard">

    <div class="dash-header">
      <div>
        <div class="greeting">Good Morning,<br>Aditi 🌸</div>
        <div class="greeting-date">Tuesday, 04 August 2026</div>
      </div>
      <div class="header-right">
        <button class="quick-log-btn" onclick="openSheet('addlog')">+ Quick Log</button>
        <div class="avatar">A</div>
      </div>
    </div>

    <div class="clay cycle-card">
      <div class="ring-wrap">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="62" fill="none" stroke="rgba(122,64,77,0.12)" stroke-width="12"/>
          <circle cx="75" cy="75" r="62" fill="none" stroke="url(#grad1)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="389.6" stroke-dashoffset="222" transform="rotate(-90 75 75)"/>
          <defs><linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D89FB6"/><stop offset="100%" stop-color="#7A404D"/>
          </linearGradient></defs>
        </svg>
        <div class="ring-center"><div class="ring-day">Day 12</div><div class="ring-label">FOLLICULAR</div></div>
      </div>
      <div class="cycle-meta">
        <div><div class="meta-val">Jul 23</div><div class="meta-label">Last Period</div></div>
        <div><div class="meta-val">28 days</div><div class="meta-label">Avg Cycle</div></div>
        <div><div class="meta-val">Follicular</div><div class="meta-label">Phase</div></div>
      </div>
      <div class="bloom">🌸</div>
    </div>

    <div class="glass next-period-card">
      <div>
        <div class="countdown-label">NEXT PERIOD EXPECTED</div>
        <div class="countdown-num">16 Days</div>
        <div class="countdown-label">20 August 2026</div>
      </div>
      <button class="clay-btn btn-primary" style="padding:12px 18px; font-size:13px;" onclick="window.location.href='calendar.html'">Open Calendar</button>
    </div>
  </div>
</div>

<div id="bottomNav" class="show">
  <div class="nav-item" data-target="dashboard" onclick="window.location.href='dashboard.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9v11h14V9"/></svg>
    Home
  </div>
  <div class="nav-item" data-target="calendar" onclick="window.location.href='calendar.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
    Calendar
  </div>
  <div class="nav-item" data-target="dailylog" onclick="window.location.href='dailylog.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V9z"/><path d="M14 3v6h6M9 13h6M9 17h6"/></svg>
    Log
  </div>
  <div class="nav-item" data-target="analytics" onclick="window.location.href='analytics.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 21V10M12 21V4M18 21v-7"/></svg>
    Insights
  </div>
  <div class="nav-item" data-target="profile" onclick="window.location.href='profile.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    Profile
  </div>
</div>


<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet()">
  <div class="glass sheet" id="sheetContent"></div>
</div>
<div id="toast" style="position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:var(--weathervane); color:#F0D2DE; padding:12px 22px; border-radius:16px; font-size:13.5px; font-weight:600; z-index:200; transition:transform .35s ease; box-shadow:0 8px 24px rgba(0,0,0,0.25);"></div>

<script src="js/main.js"></script>
<script>highlightNav('dashboard');
</script>
</body>
</html>
