<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Daily Log — Kisha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div id="app">
  <div class="screen active" id="screen-dailylog">

    <h2 class="section-title" style="margin-top:6px;" id="logTitle">Daily Log — Today</h2>

    <div class="clay log-section">
      <div class="log-label">Mood</div>
      <div class="emoji-row" id="logMood">
        <div class="emoji-btn" onclick="selectEmoji(this)">😢</div>
        <div class="emoji-btn" onclick="selectEmoji(this)">😕</div>
        <div class="emoji-btn selected" onclick="selectEmoji(this)">🙂</div>
        <div class="emoji-btn" onclick="selectEmoji(this)">😄</div>
        <div class="emoji-btn" onclick="selectEmoji(this)">🥰</div>
      </div>
    </div>

    <div class="clay log-section">
      <div class="log-label">Flow</div>
      <div class="pill-group" id="logFlow">
        <div class="pill selected" onclick="selectPill(this)">Light</div>
        <div class="pill" onclick="selectPill(this)">Medium</div>
        <div class="pill" onclick="selectPill(this)">Heavy</div>
      </div>
    </div>

    <div class="clay log-section">
      <div class="log-label">Sleep (hrs)</div>
      <input type="range" class="slider-input" id="logSleep" min="0" max="12" value="7">
    </div>

    <div class="clay log-section">
      <div class="log-label">Water Intake</div>
      <input type="range" class="slider-input" id="logWater" min="0" max="12" value="6">
    </div>

    <div class="clay log-section">
      <div class="log-label">Exercise</div>
      <select id="logExercise" style="width:100%; padding:12px 16px; border-radius:14px; border:1px solid rgba(122,64,77,0.15); background:rgba(255,255,255,0.7);">
        <option>None</option><option>Light Walk</option><option>Yoga</option><option>Cardio</option><option>Strength</option>
      </select>
    </div>

    <div class="clay log-section">
      <div class="log-label">Stress</div>
      <div class="segmented" id="logStress"><div class="seg-opt" onclick="selectSeg(this)">Low</div><div class="seg-opt selected" onclick="selectSeg(this)">Moderate</div><div class="seg-opt" onclick="selectSeg(this)">High</div></div>
    </div>

    <div class="clay log-section">
      <div class="log-label">Symptoms</div>
      <div class="chip-group" id="logSymptoms">
        <div class="chip" onclick="toggleChip(this)">Cramps</div>
        <div class="chip" onclick="toggleChip(this)">Headache</div>
        <div class="chip" onclick="toggleChip(this)">Fatigue</div>
        <div class="chip" onclick="toggleChip(this)">Bloating</div>
        <div class="chip" onclick="toggleChip(this)">Back Pain</div>
        <div class="chip" onclick="toggleChip(this)">Nausea</div>
      </div>
    </div>

    <div class="clay log-section">
      <div class="log-label">Notes</div>
      <textarea class="textarea-glass" id="logNotes" style="width:100%; padding:14px; border-radius:14px; border:1px solid rgba(122,64,77,0.15); background:rgba(255,255,255,0.7);" placeholder="How are you feeling today?"></textarea>
    </div>

    <button class="clay-btn btn-primary btn-block" id="saveLogBtn" onclick="saveDailyLog()">Save Log</button>
  </div>
</div>

<div id="bottomNav" class="show">
  <div class="nav-item" data-target="dashboard" onclick="window.location.href='dashboard.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9v11h14V9"/></svg>
    Home
  </div>
  <div class="nav-item" data-target="calendar" onclick="window.location.href='calendar.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
    Calendar
  </div>
  <div class="nav-item" data-target="dailylog" onclick="window.location.href='dailylog.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V9z"/><path d="M14 3v6h6M9 13h6M9 17h6"/></svg>
    Log
  </div>
  <div class="nav-item" data-target="analytics" onclick="window.location.href='analytics.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 21V10M12 21V4M18 21v-7"/></svg>
    Insights
  </div>
  <div class="nav-item" data-target="profile" onclick="window.location.href='profile.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    Profile
  </div>
</div>


<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet()">
  <div class="glass sheet" id="sheetContent"></div>
</div>
<div id="toast" style="position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:var(--weathervane); color:#F0D2DE; padding:12px 22px; border-radius:16px; font-size:13.5px; font-weight:600; z-index:200; transition:transform .35s ease; box-shadow:0 8px 24px rgba(0,0,0,0.25);"></div>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script>
highlightNav('dailylog');

const todayISO = new Date().toISOString().slice(0,10);
document.getElementById('logTitle').textContent = 'Daily Log — ' + new Date().toLocaleDateString('en-US', { month:'long', day:'numeric' });

function selectedPillValue(container){
  const sel = container.querySelector('.pill.selected, .seg-opt.selected');
  return sel ? sel.textContent.trim() : null;
}
function selectedEmojiValue(container){
  const btns = Array.from(container.querySelectorAll('.emoji-btn'));
  const idx = btns.findIndex(b=>b.classList.contains('selected'));
  return idx >= 0 ? btns[idx].textContent.trim() : null;
}
function selectedChips(container){
  return Array.from(container.querySelectorAll('.chip.selected')).map(c=>c.textContent.trim());
}
function applyPillValue(container, value){
  if(!value) return;
  container.querySelectorAll('.pill, .seg-opt').forEach(p=>{
    p.classList.toggle('selected', p.textContent.trim() === value);
  });
}
function applyEmojiValue(container, value){
  if(!value) return;
  container.querySelectorAll('.emoji-btn').forEach(b=>{
    b.classList.toggle('selected', b.textContent.trim() === value);
  });
}
function applyChips(container, values){
  if(!values) return;
  container.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('selected', values.includes(c.textContent.trim()));
  });
}

async function loadTodayLog(){
  try{
    const res = await authFetch('/api/logs/' + todayISO);
    const data = await res.json();
    if(!data.log) return;
    const log = data.log;
    if(log.mood) applyEmojiValue(document.getElementById('logMood'), log.mood);
    if(log.flow) applyPillValue(document.getElementById('logFlow'), log.flow);
    if(log.sleep != null) document.getElementById('logSleep').value = log.sleep;
    if(log.water != null) document.getElementById('logWater').value = log.water;
    if(log.exercise) document.getElementById('logExercise').value = log.exercise;
    if(log.stress) applyPillValue(document.getElementById('logStress'), log.stress);
    if(log.symptoms) applyChips(document.getElementById('logSymptoms'), log.symptoms);
    if(log.notes) document.getElementById('logNotes').value = log.notes;
    toast('Loaded your saved entry for today');
  }catch(e){ /* nothing saved yet, or offline — leave defaults */ }
}

async function saveDailyLog(){
  const btn = document.getElementById('saveLogBtn');
  btn.textContent = 'Saving...';
  btn.disabled = true;
  const payload = {
    date: todayISO,
    mood: selectedEmojiValue(document.getElementById('logMood')),
    flow: selectedPillValue(document.getElementById('logFlow')),
    sleep: Number(document.getElementById('logSleep').value),
    water: Number(document.getElementById('logWater').value),
    exercise: document.getElementById('logExercise').value,
    stress: selectedPillValue(document.getElementById('logStress')),
    symptoms: selectedChips(document.getElementById('logSymptoms')),
    notes: document.getElementById('logNotes').value
  };
  try{
    await authFetch('/api/logs', { method:'POST', body: JSON.stringify(payload) });
    toast('Log saved ✓');
  }catch(e){
    toast('Could not save — is the server running?');
  }
  btn.textContent = 'Save Log';
  btn.disabled = false;
}

requireAuth(()=>{ loadTodayLog(); });
</script>
</body>
</html>
