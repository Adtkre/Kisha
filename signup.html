<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<a class="back-btn" href="index.html" aria-label="Back to start">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</a>

<div id="app">
  <div class="screen active" id="screen-signup">

    <div class="auth-wrap">
      <div class="glass auth-card">
        <div class="logo" style="text-align:center; margin-bottom:20px;">Kisha ✿</div>
        <div class="auth-title">Create your account</div>
        <div class="auth-sub">Begin your wellness journey today</div>
        <form id="signupForm">
          <div class="field"><label>Full Name</label><input id="suName" type="text" placeholder="Aditi Sharma" required></div>
          <div class="field"><label>Email</label><input id="suEmail" type="email" placeholder="you@example.com" required></div>
          <div class="field"><label>Password</label><input id="suPassword" type="password" placeholder="At least 6 characters" required minlength="6"></div>
          <div class="field"><label>Confirm Password</label><input id="suConfirm" type="password" placeholder="••••••••" required minlength="6"></div>
          <label class="checkbox-row"><input id="suTerms" type="checkbox" required> I agree to the Terms & Privacy Policy</label>
          <div id="signupError" style="display:none; background:rgba(201,124,124,0.15); color:var(--rose-red); font-size:12.5px; font-weight:600; padding:10px 14px; border-radius:12px; margin-bottom:16px;"></div>
          <button type="submit" class="clay-btn btn-primary btn-block" id="signupBtn">Create Account</button>
        </form>
        <div class="auth-switch">Already have an account? <a onclick="window.location.href='login.html'">Login</a></div>
      </div>
    </div>
  </div>
</div>

<div id="toast" style="position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:var(--weathervane); color:#F0D2DE; padding:12px 22px; border-radius:16px; font-size:13.5px; font-weight:600; z-index:200; transition:transform .35s ease; box-shadow:0 8px 24px rgba(0,0,0,0.25);"></div>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const errBox = document.getElementById('signupError');
  const btn = document.getElementById('signupBtn');
  errBox.style.display = 'none';

  const name = document.getElementById('suName').value.trim();
  const email = document.getElementById('suEmail').value.trim();
  const password = document.getElementById('suPassword').value;
  const confirm = document.getElementById('suConfirm').value;
  const terms = document.getElementById('suTerms').checked;

  if(password !== confirm){
    errBox.textContent = 'Passwords do not match.';
    errBox.style.display = 'block';
    return;
  }
  if(!terms){
    errBox.textContent = 'Please agree to the Terms & Privacy Policy.';
    errBox.style.display = 'block';
    return;
  }

  btn.textContent = 'Creating account...';
  btn.disabled = true;
  try{
    const res = await fetch('/api/auth/signup', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if(!res.ok){
      errBox.textContent = data.error || 'Could not create account.';
      errBox.style.display = 'block';
      btn.textContent = 'Create Account';
      btn.disabled = false;
      return;
    }
    setSession(data.token, data.user);
    window.location.href = 'onboarding.html';
  }catch(err){
    errBox.textContent = 'Could not reach the server. Is it running? (npm start in /server)';
    errBox.style.display = 'block';
    btn.textContent = 'Create Account';
    btn.disabled = false;
  }
});
</script>

</body>
</html>
