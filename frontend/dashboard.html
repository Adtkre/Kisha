<style>
/* ============================================================
   DASHBOARD HERO
   ============================================================ */

.hero-card{
  position:relative;

  /* Slightly smaller than original 78vh */
  min-height:74vh;

  padding:34px 26px 30px;
  margin-bottom:18px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  overflow:hidden;
  border-radius:36px;

  background:
    radial-gradient(
      circle at 12% 6%,
      rgba(255,255,255,0.6),
      transparent 42%
    ),
    radial-gradient(
      circle at 88% 92%,
      rgba(255,255,255,0.35),
      transparent 40%
    ),
    linear-gradient(
      160deg,
      var(--clay-bg) 0%,
      rgba(240,210,222,0.8) 100%
    );
}


/* =========================
   FLOWERS
   ========================= */

.hero-flower{
  position:absolute;
  opacity:0.3;
  pointer-events:none;
  color:var(--berry-bush);
}

.hero-flower svg{
  width:100%;
  height:100%;
  display:block;
}

.hero-flower.fl-left{
  top:8px;
  left:-30px;
  width:180px;
  height:180px;
  transform:rotate(-12deg);
}

.hero-flower.fl-right{
  bottom:-10px;
  right:-32px;
  width:190px;
  height:190px;
  transform:rotate(8deg) scaleX(-1);
}


/* =========================
   SPARKLES
   ========================= */

.hero-sparkle{
  position:absolute;
  color:var(--gizmo);
  opacity:0.55;
  pointer-events:none;
}

.hero-sparkle svg{
  width:100%;
  height:100%;
  display:block;
}

.hero-sparkle.sp1{
  top:52px;
  right:36px;
  width:16px;
  height:16px;
}

.hero-sparkle.sp2{
  top:105px;
  left:34px;
  width:11px;
  height:11px;
  opacity:0.4;
}

.hero-sparkle.sp3{
  bottom:125px;
  right:24px;
  width:13px;
  height:13px;
  opacity:0.45;
}


/* =========================
   CYCLE RING
   ========================= */

.hero-ring-wrap{
  position:relative;
  display:flex;
  justify-content:center;

  margin:4px 0 4px;

  z-index:1;
}

.hero-ring-wrap svg{
  width:205px;
  height:205px;

  filter:
    drop-shadow(
      0 10px 22px rgba(122,64,77,0.24)
    );
}

.hero-ring-plate{
  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  width:160px;
  height:160px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff,
      #FBF0F4 70%
    );

  box-shadow:
    inset 0 2px 8px rgba(255,255,255,0.9),
    0 6px 16px rgba(122,64,77,0.16);
}

.hero-ring-center{
  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  text-align:center;
  z-index:2;
}

.hero-ring-num{
  font-family:'Playfair Display',serif;
  font-weight:700;

  font-size:48px;
  line-height:1;

  color:var(--berry-bush);
}

.hero-ring-unit{
  font-size:11.5px;
  font-weight:700;

  letter-spacing:0.8px;

  color:var(--text-secondary);

  margin-top:5px;
}

.hero-ring-phase{
  display:inline-block;

  margin-top:10px;

  padding:5px 15px;

  border-radius:20px;

  font-size:11.5px;
  font-weight:700;

  letter-spacing:0.3px;

  background:rgba(122,64,77,0.12);
  color:var(--berry-bush);
}


/* =========================
   CAPTION
   ========================= */

.hero-caption{
  text-align:center;

  margin-top:20px;

  font-size:13.5px;
  font-weight:600;

  color:var(--text-secondary);

  letter-spacing:0.3px;
}

.hero-caption span{
  color:var(--berry-bush);
  font-weight:700;
}


/* =========================
   META ROW
   ========================= */

.hero-meta-row{
  display:flex;
  justify-content:space-around;

  text-align:center;

  margin-top:22px;
  padding-top:18px;

  border-top:
    1px solid rgba(122,64,77,0.14);

  position:relative;
  z-index:1;
}

.hero-meta-row .meta-val{
  font-weight:700;
  font-size:16px;
}

.hero-meta-row .meta-label{
  font-size:11px;

  color:var(--text-secondary);

  margin-top:3px;

  letter-spacing:0.2px;
}


/* =========================
   CALENDAR BUTTON
   ========================= */

.hero-cta{
  display:block;

  width:100%;

  margin-top:22px;

  text-align:center;

  padding:15px 18px;

  border-radius:20px;

  font-size:14.5px;
  font-weight:700;

  background:var(--berry-bush);
  color:#fff;

  box-shadow:
    5px 5px 14px rgba(122,64,77,0.3),
    -3px -3px 8px rgba(255,255,255,0.4);

  position:relative;
  z-index:1;
}

.hero-cta:active{
  transform:scale(0.98);
}


/* =========================
   SMALL SCREENS
   ========================= */

@media (max-width:380px){

  .hero-card{
    min-height:72vh;
    padding:30px 18px 26px;
  }

  .hero-ring-wrap svg{
    width:190px;
    height:190px;
  }

  .hero-ring-plate{
    width:148px;
    height:148px;
  }

  .hero-ring-num{

  }

  .hero-caption{
    margin-top:18px;
  }

  .hero-meta-row{
    margin-top:20px;
    padding-top:17px;
  }

  .hero-cta{
    margin-top:20px;
    padding:14px 16px;
  }
}

</style>
</head>

<script>

highlightNav('dashboard');


document.getElementById('dashDate').textContent =
  new Date().toLocaleDateString(
    'en-US',
    {
      weekday:'long',
      day:'2-digit',
      month:'long',
      year:'numeric'
    }
  );


function phaseFor(dayNum, avgCycle, isInPeriod){

  if(isInPeriod){

    const period =
      Math.min(
        6,
        Math.round(avgCycle * 0.18)
      );

    return dayNum <= period
      ? 'Menstrual'
      : 'Follicular';
  }


  const ovulationCenter =
    Math.round(avgCycle / 2);

  if(dayNum <= ovulationCenter - 2)
    return 'Follicular';

  if(dayNum <= ovulationCenter + 2)
    return 'Ovulation';

  return 'Luteal';
}


async function loadDashboard(user){

  const firstName =
    (user.name || 'there')
      .split(' ')[0];

  const hour =
    new Date().getHours();

  const greetWord =
    hour < 12
      ? 'Good Morning'
      : hour < 17
        ? 'Good Afternoon'
        : 'Good Evening';


  document.getElementById(
    'dashGreeting'
  ).innerHTML =
    greetWord +
    ',<br>' +
    firstName;


  document.getElementById(
    'dashAvatar'
  ).textContent =
    initialsOf(user.name);


  try{

    const res =
      await authFetch('/api/cycles-summary');

    const summary =
      await res.json();

    const avgCycle =
      summary.avgCycleLength || 28;


    document.getElementById(
      'metaAvgCycle'
    ).textContent =
      avgCycle + ' days';


    if(!summary.lastPeriodStart){

      document.getElementById(
        'ringDay'
      ).textContent = '—';

      document.getElementById(
        'ringUnit'
      ).textContent = 'NO DATA YET';

      document.getElementById(
        'ringLabel'
      ).textContent = 'Log a period';

      document.getElementById(
        'metaLastPeriod'
      ).textContent = '—';

      document.getElementById(
        'metaPhase'
      ).textContent = '—';

      document.getElementById(
        'heroCaption'
      ).textContent =
        'Log your first period to see a prediction here';

      return;
    }


    const startDate =
      new Date(
        summary.lastPeriodStart +
        'T00:00:00'
      );


    const periodEndDate =
      summary.periodEndDate
        ? new Date(
            summary.periodEndDate +
            'T00:00:00'
          )
        : null;


    document.getElementById(
      'metaLastPeriod'
    ).textContent =
      startDate.toLocaleDateString(
        'en-US',
        {
          month:'short',
          day:'numeric'
        }
      );


    const today = new Date();

    today.setHours(
      0,
      0,
      0,
      0
    );


    const isInPeriod =
      periodEndDate
        ? today <= periodEndDate
        : Boolean(summary.ongoing);


    let dayNum =
      Math.max(
        1,
        Math.floor(
          (today - startDate) /
          86400000
        ) + 1
      );


    if(
      periodEndDate &&
      today > periodEndDate
    ){

      const daysSinceEnd =
        Math.max(
          1,
          Math.floor(
            (today - periodEndDate) /
            86400000
          ) + 1
        );


      dayNum =
        Math.max(
          1,
          Math.min(
            avgCycle,
            daysSinceEnd + 5
          )
        );
    }


    const phase =
      phaseFor(
        dayNum,
        avgCycle,
        isInPeriod
      );


    document.getElementById(
      'metaPhase'
    ).textContent =
      phase;


    const pct =
      Math.min(
        1,
        dayNum / avgCycle
      );


    const circumference =
      590.6;


    document.getElementById(
      'cycleRing'
    ).style.strokeDashoffset =
      String(
        circumference *
        (1 - pct)
      );


    const nextPeriod =
      summary.nextPeriodDate
        ? new Date(
            summary.nextPeriodDate +
            'T00:00:00'
          )
        : null;


    const daysUntil =
      nextPeriod
        ? Math.round(
            (nextPeriod - today) /
            86400000
          )
        : null;


    if(isInPeriod){

      document.getElementById(
        'ringDay'
      ).textContent =
        'Day ' + dayNum;

      document.getElementById(
        'ringUnit'
      ).textContent =
        'OF YOUR PERIOD';

      document.getElementById(
        'ringLabel'
      ).textContent =
        phase;

      document.getElementById(
        'heroCaption'
      ).innerHTML =
        'Period started <span>' +
        startDate.toLocaleDateString(
          'en-US',
          {
            month:'short',
            day:'numeric'
          }
        ) +
        '</span>';

    }

    else if(daysUntil === null){

      document.getElementById(
        'ringDay'
      ).textContent =
        '—';

      document.getElementById(
        'ringUnit'
      ).textContent =
        '';

      document.getElementById(
        'ringLabel'
      ).textContent =
        phase;

      document.getElementById(
        'heroCaption'
      ).textContent =
        '';

    }

    else if(daysUntil <= 0){

      document.getElementById(
        'ringDay'
      ).textContent =
        'Now';

      document.getElementById(
        'ringUnit'
      ).textContent =
        'ANY DAY';

      document.getElementById(
        'ringLabel'
      ).textContent =
        phase;

      document.getElementById(
        'heroCaption'
      ).innerHTML =
        'Expected <span>' +
        nextPeriod.toLocaleDateString(
          'en-US',
          {
            day:'2-digit',
            month:'long',
            year:'numeric'
          }
        ) +
        '</span>';

    }

    else{

      document.getElementById(
        'ringDay'
      ).textContent =
        daysUntil;

      document.getElementById(
        'ringUnit'
      ).textContent =
        daysUntil === 1
          ? 'DAY LEFT'
          : 'DAYS LEFT';

      document.getElementById(
        'ringLabel'
      ).textContent =
        phase;

      document.getElementById(
        'heroCaption'
      ).innerHTML =
        'Next period expected <span>' +
        nextPeriod.toLocaleDateString(
          'en-US',
          {
            day:'2-digit',
            month:'long',
            year:'numeric'
          }
        ) +
        '</span>';
    }

  }

  catch(e){

    document.getElementById(
      'ringLabel'
    ).textContent =
      'Offline';

  }
}


function onCycleChanged(){

  loadDashboard(
    getStoredUser() || {}
  );

}


requireAuth(loadDashboard);

</script>

</html>
