<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Kisha — Know Your Body, Beautifully</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/samarkan">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== Story slides — assets/bg1.png background for all slides ===== */
    .story-slide,
    .story-slide.s1,
    .story-slide.s2,
    .story-slide.s3 {
      background: url('assets/bg1.png') center center / cover no-repeat !important;
    }

    .story-slide.s1 .story-waves {
      display: none;
    }

    .s1-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 32px;
    }

    .s1-wordmark {
      font-family: 'Samarkan', 'Playfair Display', serif;
      font-size: clamp(160px, 22vw, 118px);
      color: #ffffff;
      text-align: center;
      line-height: 1;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
      transform: translateX(-5%);
    }

    .story-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 18px !important;
      text-align: center;
    }

    .story-heading {
      font-family: 'Samarkan', 'Playfair Display', serif;
      font-size: clamp(74px, 20vw, 114px);
      line-height: 0.95;
      color: #ffffff;
      text-align: center;
      margin: 0;
      text-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      max-width: 100%;
      box-sizing: border-box;
      padding: 0;
      word-break: normal;
      overflow-wrap: normal;
    }

    .story-slide.s2 .story-heading {
      font-size: clamp(86px, 24vw, 134px);
      line-height: 0.92;
    }

    .story-cta {
      position: absolute;
      bottom: 34px;
      left: 0;
      right: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      z-index: 40;
    }

    .story-cta-btn {
      background: transparent !important;
      color: #ffffff !important;
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 800;
      padding: 8px 16px;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      text-decoration: none;
      letter-spacing: 0.8px;
      display: inline-block;
      text-shadow:
        0 1px 0 #d9c4cc,
        0 2px 0 #b5919d,
        0 3px 0 #895867,
        0 4px 0 #5f2b3a,
        0 5px 0 #3a131f,
        0 6px 6px rgba(0, 0, 0, 0.65),
        0 10px 18px rgba(0, 0, 0, 0.45);
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), text-shadow 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer;
    }

    .story-cta-btn:hover {
      background: transparent !important;
      transform: translateY(-2px);
      text-shadow:
        0 1px 0 #ffffff,
        0 2px 0 #d9c4cc,
        0 3px 0 #b5919d,
        0 4px 0 #895867,
        0 5px 0 #5f2b3a,
        0 6px 0 #3a131f,
        0 8px 10px rgba(0, 0, 0, 0.75),
        0 12px 22px rgba(0, 0, 0, 0.5);
    }

    .story-cta-btn:active {
      transform: translateY(3px);
      text-shadow:
        0 1px 0 #b5919d,
        0 2px 0 #5f2b3a,
        0 3px 4px rgba(0, 0, 0, 0.7);
    }

    .story-signup-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
    }

    .story-signup-text a {
      color: #ffffff;
      font-weight: 700;
      text-decoration: underline;
    }

    /* All three slides now sit on dark jewel-tone backgrounds, so the progress bar + topbar stay light throughout */
    #storyViewport.on-dark .story-seg {
      background: rgba(255, 255, 255, 0.22);
    }

    #storyViewport.on-dark .story-seg-fill {
      background: #ffffff;
    }

    #storyViewport.on-dark .story-topbar .logo {
      color: #ffffff;
    }

    #storyViewport.on-dark .story-topbar .logo span {
      color: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>

<body class="story-body">

  <div class="story-viewport" id="storyViewport">

    <div class="story-progress" id="storyProgress">
      <div class="story-seg" data-i="0"><span class="story-seg-fill"></span></div>
      <div class="story-seg" data-i="1"><span class="story-seg-fill"></span></div>
      <div class="story-seg" data-i="2"><span class="story-seg-fill"></span></div>
    </div>

    <div class="story-topbar">
      <div class="logo">Kisha</div>
    </div>

    <div class="story-slides" id="storySlides">

      <!-- SLIDE 1 — Hero Wordmark -->
      <div class="story-slide s1">
        <div class="s1-content">
          <div class="s1-wordmark">Kisha</div>
        </div>
        <div class="story-hint">Tap to continue →</div>
      </div>

      <!-- SLIDE 2 — Track Boldly -->
      <div class="story-slide s2">
        <div class="story-content">
          <h2 class="story-heading">Track<br>Boldly</h2>
        </div>
        <div class="story-hint">Tap to continue →</div>
      </div>

      <!-- SLIDE 3 — Create Account + Login -->
      <div class="story-slide s3">
        <div class="story-content">
          <h2 class="story-heading">Create<br>Account</h2>
        </div>
        <div class="story-cta">
          <a class="story-cta-btn" href="login.html" onclick="event.stopPropagation()">Log In</a>
          <div class="story-signup-text" onclick="event.stopPropagation()">Don't have an account? <a
              href="signup.html">Create now</a></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const total = 3;
    let current = 0;
    let autoTimer = null;
    const slidesEl = document.getElementById('storySlides');
    const segs = document.querySelectorAll('.story-seg');
    const viewport = document.getElementById('storyViewport');

    function render() {
      slidesEl.style.transform = 'translateX(-' + (current * (100 / total)) + '%)';
      segs.forEach((seg, i) => {
        seg.classList.remove('active', 'completed');
        void seg.offsetWidth; // reset animation
        if (i < current) seg.classList.add('completed');
        if (i === current) seg.classList.add('active');
      });
      viewport.classList.add('on-dark');
      clearTimeout(autoTimer);
      autoTimer = setTimeout(nextSlide, 6000);
    }
    function nextSlide() {
      current = (current + 1) % total;
      render();
    }
    function prevSlide() {
      current = current === 0 ? 0 : current - 1;
      render();
    }

    viewport.addEventListener('click', function (e) {
      if (e.target.closest('.story-cta')) return; // let real links/buttons work untouched
      const rect = viewport.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < rect.width * 0.4) { prevSlide(); } else { nextSlide(); }
    });

    // basic swipe support
    let touchStartX = null;
    viewport.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
    viewport.addEventListener('touchend', e => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) {
        if (e.target.closest('.story-cta')) { touchStartX = null; return; }
        dx < 0 ? nextSlide() : prevSlide();
      }
      touchStartX = null;
    }, { passive: true });

    // keyboard arrows for desktop
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    render();
  </script>

</body>

</html>
